name: Nightly
# Builds main into a draft, then swaps it in as the rolling `nightly` pre-release and keeps an
# immutable `nightly-YYYYMMDDHHMMSS` copy for 14 days (docs/channels.md).
# Re-run with "Re-run all jobs", never "Re-run failed jobs": a failed run deletes its draft.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  REPO: ${{ github.repository }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      version: ${{ steps.v.outputs.version }}
      at: ${{ steps.v.outputs.at }}
    steps:
      - name: Refuse anything but main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::nightly builds only from main"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-nu@1b8faed9a8ff673c8ce0beae243e0b72d0787241 # v3.30
        with:
          version: 0.117.0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ] && [ "$(scripts/release.sh feed-field nightly commit)" = "$GITHUB_SHA" ]; then
            echo "main has not changed since the last nightly"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          blockers=$(gh api "repos/$REPO/issues?state=open&labels=regression,blocks-nightly&per_page=100" -q '[.[] | select(.pull_request | not)] | length')
          [ "$blockers" = 0 ] || { echo "::error::$blockers open issue(s) labeled regression and blocks-nightly"; exit 1; }
          at=$(date -u +%Y%m%d%H%M%S)
          version=$(nu scripts/version.nu nightly --at "$at" --commit "$GITHUB_SHA")
          scripts/release.sh check-newer nightly "$version"
          printf 'skip=false\nat=%s\nversion=%s\n' "$at" "$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml

  draft:
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.d.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "id=$(scripts/release.sh draft nightly "$VERSION" "$GITHUB_SHA" "nightly-build-$GITHUB_RUN_ID")" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, draft]
    uses: ./.github/workflows/build.yml
    with:
      channel: nightly
      version: ${{ needs.prepare.outputs.version }}
      at: ${{ needs.prepare.outputs.at }}
      commit: ${{ github.sha }}
      draft: ${{ needs.draft.outputs.id }}
    secrets: inherit

  publish:
    needs: [prepare, draft, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Write latest.json and swap the draft in as nightly
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATER_SIGNING_KEY_PASSWORD }}
          DRAFT: ${{ needs.draft.outputs.id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [ -n "$UPDATER_SIGNING_KEY" ] || echo "::warning title=Unsigned feed::UPDATER_SIGNING_KEY is not set, so latest.json has no signatures and updaters will not install this build."
          scripts/release.sh publish nightly "$DRAFT" "$VERSION" "$GITHUB_SHA"

  cleanup:
    needs: [draft, build, publish]
    if: always() && needs.draft.outputs.id != '' && (needs.build.result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ needs.draft.outputs.id }}
        run: scripts/release.sh discard "$DRAFT"

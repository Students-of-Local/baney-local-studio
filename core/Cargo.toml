[package]
name = "local-studio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared Local Studio logic: the Eukhe daemon client, session model and transcript reducer for the native GUIs"

[features]
ffi = ["dep:uniffi"]
wire = []
# Pause points for scripts/tests/plugin-grants-test.sh. Never on in a shipped build.
test-hooks = []
link = ["wire", "dep:snow", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:webpki-roots"]

[dependencies]
eukhe-client.workspace = true
eukhe-types.workspace = true
local-studio-version.workspace = true
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
image.workspace = true
ignore.workspace = true
libghostty-vt.workspace = true
notify.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
syntect.workspace = true
toml.workspace = true
two-face.workspace = true
x25519-dalek.workspace = true
uniffi = { workspace = true, optional = true }
snow = { version = "0.10", optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

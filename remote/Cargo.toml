[package]
name = "local-studio-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Studio Remote: serves the core to paired phones over a WebSocket"

[[bin]]
name = "local-studio-serve"
path = "src/main.rs"

[dependencies]
local-studio-core = { workspace = true, features = ["wire", "link"] }
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
reqwest.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
qrcode = { version = "0.14", default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
eukhe-client.workspace = true
eukhe-types.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true

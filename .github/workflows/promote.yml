name: Promote
# gh workflow run promote.yml --ref main -f nightly=nightly-YYYYMMDDHHMMSS
# gh workflow run promote.yml --ref main -f hotfix=true
# It checks the promotion rule and builds the vX.Y.Z draft. It moves nothing: a repository admin then runs scripts/release-stable.sh X.Y.Z (docs/channels.md).
on:
  workflow_dispatch:
    inputs:
      nightly:
        description: The nightly-YYYYMMDDHHMMSS tag to promote
        type: string
        default: ""
      hotfix:
        description: Build stable's head as the next patch release instead
        type: boolean
        default: false
permissions:
  contents: write
  issues: read
concurrency:
  group: stable
  cancel-in-progress: false
env:
  REPO: ${{ github.repository }}
jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      commit: ${{ steps.pick.outputs.commit }}
      at: ${{ steps.draft.outputs.at }}
      draft: ${{ steps.draft.outputs.id }}
    steps:
      - name: Refuse anything but main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run this on main: gh workflow run promote.yml --ref main"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: hustcer/setup-nu@1b8faed9a8ff673c8ce0beae243e0b72d0787241 # v3.30
        with:
          version: 0.117.0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          head=$(git ls-remote origin refs/heads/stable | cut -f1)
          [ -n "$head" ] || die "no stable branch"
          git fetch -q origin stable
          if [ "$HOTFIX" = true ]; then
            [ -z "$NIGHTLY" ] || die "pass nightly or hotfix=true, not both"
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$head") || die "stable has no vX.Y.Z tag to follow"
            if [ "$(git rev-parse "$last^{commit}")" = "$head" ]; then
              ! gh api "repos/$REPO/releases/tags/$last" > /dev/null 2>&1 || die "stable's head is already the published $last"
              version=${last#v}
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              version="$major.$minor.$((patch + 1))"
            fi
            commit=$head
            git checkout -q "$commit"
            stamped=$(nu scripts/version.nu stable --commit "$commit")
            [ "$stamped" = "$version" ] || die "stable's head builds $stamped; bump the workspace version to $version in the hotfix"
          else
            [[ $NIGHTLY =~ ^nightly-[0-9]{14}$ ]] || die "nightly must be a nightly-YYYYMMDDHHMMSS tag"
            published=$(gh api "repos/$REPO/releases/tags/$NIGHTLY" -q .published_at) || die "no release $NIGHTLY"
            age=$(( $(date -u +%s) - $(date -u -d "$published" +%s) ))
            [ "$age" -ge 259200 ] || die "$NIGHTLY was published $((age / 3600)) hours ago; promotion needs 72"
            commit=$(git rev-parse "$NIGHTLY^{commit}")
            git merge-base --is-ancestor "$head" "$commit" || die "$NIGHTLY ($commit) does not contain stable's head $head"
            gh release download "$NIGHTLY" -R "$REPO" -p latest.json -O "$RUNNER_TEMP/nightly.json"
            [ "$(jq -r .commit "$RUNNER_TEMP/nightly.json")" = "$commit" ] || die "$NIGHTLY's latest.json names another commit"
            git checkout -q "$commit"
            version=$(nu scripts/version.nu stable --commit "$commit")
            case $(jq -r .version "$RUNNER_TEMP/nightly.json") in
              "$version"-nightly.*) ;;
              *) die "$NIGHTLY is not a $version nightly" ;;
            esac
            open=$(gh api "repos/$REPO/issues?state=open&labels=regression&per_page=100" -q '[.[] | select(.pull_request | not)] | length')
            [ "$open" = 0 ] || die "$open open issue(s) labeled regression"
          fi
          git diff --quiet "$commit" "$GITHUB_SHA" -- .github/workflows/build.yml || die "build.yml on main differs from $commit's, and this run would build $commit with main's; bring build.yml to match (for a hotfix, cherry-pick it onto stable) or promote a newer nightly"
          tagged=$(git ls-remote --tags origin "refs/tags/v$version" | cut -f1)
          [ -z "$tagged" ] || [ "$(git rev-parse "$tagged^{commit}")" = "$commit" ] || die "v$version already exists on another commit"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
          COMMIT: ${{ steps.pick.outputs.commit }}
        run: |
          set -euo pipefail
          scripts/release.sh check-newer stable "$VERSION"
          for old in $(gh api "repos/$REPO/releases" --paginate -q ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id"); do
            scripts/release.sh discard "$old"
          done
          echo "at=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "id=$(scripts/release.sh draft stable "$VERSION" "$COMMIT" "v$VERSION")" >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    uses: ./.github/workflows/build.yml
    with:
      channel: stable
      version: ${{ needs.pick.outputs.version }}
      at: ${{ needs.pick.outputs.at }}
      commit: ${{ needs.pick.outputs.commit }}
      draft: ${{ needs.pick.outputs.draft }}
    secrets: inherit

  ready:
    needs: [pick, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.pick.outputs.version }}
      COMMIT: ${{ needs.pick.outputs.commit }}
      DRAFT: ${{ needs.pick.outputs.draft }}
      KIND: ${{ inputs.hotfix && 'hotfix' || 'nightly' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record what this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifest"
          scripts/release.sh manifest "$DRAFT" "$VERSION" "$COMMIT" "$KIND" > "$RUNNER_TEMP/manifest/promote.json"
          cat "$RUNNER_TEMP/manifest/promote.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promote-manifest
          path: ${{ runner.temp }}/manifest/promote.json
          if-no-files-found: error
          retention-days: 90
      - name: Point the draft at this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPO/releases/$DRAFT" -f body="promote run $GITHUB_RUN_ID" > /dev/null
          {
            echo "Draft v$VERSION ($KIND) is built from $COMMIT."
            echo
            echo "Once this run has finished green, a repository admin finishes the release from a checkout: \`scripts/release-stable.sh $VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [pick, build]
    if: always() && needs.pick.outputs.draft != '' && needs.build.result != 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ needs.pick.outputs.draft }}
        run: scripts/release.sh discard "$DRAFT"
